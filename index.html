<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Планер</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0a0c12">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://w3.org' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%234f46e5'/><rect x='24' y='30' width='52' height='46' rx='10' fill='white'/><rect x='34' y='20' width='8' height='16' rx='4' fill='%23a5b4fc'/><rect x='58' y='20' width='8' height='16' rx='4' fill='%23a5b4fc'/><circle cx='39' cy='48' r='4' fill='%234f46e5'/><circle cx='50' cy='48' r='4' fill='%234f46e5'/><circle cx='61' cy='48' r='4' fill='%234f46e5'/><circle cx='39' cy='61' r='4' fill='%234f46e5'/><circle cx='50' cy='61' r='4' fill='%234f46e5'/><circle cx='61' cy='61' r='4' fill='%234f46e5'/></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="island-wrapper">
    <div class="dynamic-island">
      <div class="island-main">
        <span class="dot" id="syncDot"></span>
        <span id="syncStatus">Подключение...</span>
        <span class="island-sep">•</span>
        <span class="island-date" id="todayLabel">Загрузка...</span>
      </div>
    </div>
  </div>

  <main class="split-dashboard">
    <section class="panel-col view active" id="view-tasks">
      <div class="col-header">
        <div>
          <h2>📋 Задачи на день</h2>
          <p class="col-sub">Главные дела на сегодня</p>
        </div>
        <span class="progress-badge" id="progressText">0/0 (0%)</span>
      </div>
      <div class="progress-wrap"><div class="progress-fill" id="progressFill"></div></div>
      <div class="input-bar">
        <input type="text" id="taskInput" placeholder="Добавить задачу..." onkeydown="if(event.key==='Enter') addTask()">
        <select id="taskPrio">
          <option value="high">🔥 Высокий</option>
          <option value="mid" selected>⚡ Обычный</option>
          <option value="low">🌿 Низкий</option>
        </select>
        <button class="btn-add" onclick="addTask()">+</button>
      </div>
      <div class="scroll-list" id="tasksList"></div>
    </section>

    <section class="panel-col view" id="view-habits">
      <div class="col-header">
        <div>
          <h2>🔥 Трекер привычек</h2>
          <p class="col-sub">Отмечай каждый день без пропусков</p>
        </div>
      </div>
      <div class="input-bar">
        <input type="text" id="habitInput" placeholder="Новая привычка..." onkeydown="if(event.key==='Enter') addHabit()">
        <button class="btn-add" onclick="addHabit()">+</button>
      </div>
      <div class="scroll-list" id="habitsList"></div>
    </section>
  </main>

  <nav class="mobile-nav">
    <button class="m-btn active" data-tab="tasks" onclick="switchTab('tasks')"><span>📋</span>Задачи</button>
    <button class="m-btn" data-tab="habits" onclick="switchTab('habits')"><span>🔥</span>Привычки</button>
  </nav>

  <script src="app.js"></script>
</body>
</html>
