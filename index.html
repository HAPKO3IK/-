<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Планер</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0a0c12">
  <style>
    :root {
      --bg: #0a0c12; --panel: rgba(20, 24, 34, 0.88); --card: #1b202e; --card-hover: #23293b;
      --accent: #6366f1; --accent-hover: #4f46e5; --green: #10b981; --orange: #f59e0b;
      --red: #ef4444; --text: #f8fafc; --muted: #94a3b8; --border: rgba(255, 255, 255, 0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background: radial-gradient(circle at 50% 0%, #161b2e 0%, var(--bg) 60%); color: var(--text); display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.14); border-radius: 10px; }
    .island-wrapper { position: fixed; top: 14px; left: 0; right: 0; display: flex; justify-content: center; z-index: 200; pointer-events: none; }
    .dynamic-island { pointer-events: auto; background: #000; border: 1px solid rgba(255, 255, 255, 0.18); border-radius: 99px; padding: 9px 22px; box-shadow: 0 12px 32px rgba(0, 0, 0, 0.8); }
    .island-main { display: flex; align-items: center; gap: 10px; font-size: 12.5px; font-weight: 600; white-space: nowrap; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--orange); flex-shrink: 0; }
    .dot.online { background: var(--green); box-shadow: 0 0 8px var(--green); }
    .dot.error { background: var(--red); }
    .island-sep { color: rgba(255, 255, 255, 0.25); }
    .island-date { color: var(--muted); text-transform: capitalize; }
    .split-dashboard { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; padding: 66px 24px 24px; max-width: 1440px; width: 100%; margin: 0 auto; overflow: hidden; }
    .panel-col { background: var(--panel); border: 1px solid var(--border); border-radius: 20px; padding: 20px; display: flex; flex-direction: column; overflow: hidden; }
    .col-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 14px; gap: 10px; }
    .col-header h2 { font-size: 18px; font-weight: 800; }
    .col-sub { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
    .progress-badge { font-size: 12px; font-weight: 700; color: #a5b4fc; background: rgba(99, 102, 241, 0.16); padding: 5px 10px; border-radius: 9px; }
    .progress-wrap { background: rgba(255, 255, 255, 0.06); height: 7px; border-radius: 99px; overflow: hidden; margin-bottom: 16px; flex-shrink: 0; }
    .progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent), var(--green)); transition: width 0.35s ease; }
    .input-bar { display: flex; gap: 8px; margin-bottom: 16px; flex-shrink: 0; }
    input[type="text"], select { background: rgba(10, 12, 18, 0.75); border: 1px solid var(--border); color: var(--text); padding: 11px 13px; border-radius: 12px; font-size: 14px; outline: none; }
    input[type="text"] { flex: 1; min-width: 0; }
    .btn-add { background: var(--accent); color: #fff; border: none; width: 42px; border-radius: 12px; font-weight: 700; font-size: 20px; cursor: pointer; flex-shrink: 0; }
    .scroll-list { flex: 1; overflow-y: auto; padding-right: 4px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 13px; padding: 12px 14px; margin-bottom: 9px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .task-left { display: flex; align-items: center; gap: 11px; flex: 1; cursor: pointer; min-width: 0; }
    .checkbox { width: 21px; height: 21px; border-radius: 7px; border: 2px solid var(--muted); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .card.done { opacity: 0.65; }
    .card.done .checkbox { background: var(--green); border-color: var(--green); }
    .card.done .checkbox::after { content: '✓'; color: #052e16; font-weight: 900; font-size: 13px; }
    .task-text { font-size: 14.5px; word-break: break-word; }
    .card.done .task-text { text-decoration: line-through; color: var(--muted); }
    .badge { font-size: 11px; font-weight: 700; padding: 4px 8px; border-radius: 7px; white-space: nowrap; }
    .prio-high { background: rgba(239, 68, 68, 0.18); color: #fca5a5; }
    .prio-mid { background: rgba(99, 102, 241, 0.18); color: #a5b4fc; }
    .prio-low { background: rgba(16, 185, 129, 0.18); color: #6ee7b7; }
    .del-btn { background: transparent; border: none; color: var(--muted); font-size: 15px; cursor: pointer; padding: 4px 6px; }
    .habit-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px; margin-bottom: 10px; }
    .habit-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .habit-days { display: flex; gap: 6px; margin-top: 11px; }
    .day-pill { flex: 1; text-align: center; padding: 6px 0; border-radius: 8px; font-size: 11px; font-weight: 700; background: rgba(255, 255, 255, 0.04); color: var(--muted); border: 1px solid transparent; }
    .day-pill.done { background: rgba(16, 185, 129, 0.2); color: #6ee7b7; border-color: rgba(16, 185, 129, 0.4); }
    .day-pill.today { border-color: var(--accent); }
    .habit-btn { padding: 7px 13px; border-radius: 9px; border: none; font-weight: 700; cursor: pointer; font-size: 12px; background: rgba(99, 102, 241, 0.2); color: #a5b4fc; }
    .habit-btn.checked { background: var(--green); color: #052e16; }
    .mobile-nav { display: none; }
    @media (max-width: 820px) {
      .split-dashboard { display: block; padding: 62px 14px 76px; }
      .panel-col { display: none; height: 100%; }
      .panel-col.active { display: flex; }
      .mobile-nav { display: flex; position: fixed; bottom: 0; left: 0; right: 0; height: 62px; background: rgba(15, 18, 26, 0.95); border-top: 1px solid var(--border); justify-content: space-around; align-items: center; z-index: 100; }
      .m-btn { background: none; border: none; color: var(--muted); display: flex; flex-direction: column; align-items: center; font-size: 11px; font-weight: 600; }
      .m-btn.active { color: var(--accent); }
    }
  </style>
</head>
<body>
  <div class="island-wrapper">
    <div class="dynamic-island">
      <div class="island-main">
        <span class="dot" id="syncDot"></span>
        <span id="syncStatus">Подключение...</span>
        <span class="island-sep">•</span>
        <span class="island-date" id="todayLabel">Загрузка...</span>
      </div>
    </div>
  </div>
  <main class="split-dashboard">
    <section class="panel-col view active" id="view-tasks">
      <div class="col-header">
        <div><h2>📋 Задачи на день</h2><p class="col-sub">Главные дела на сегодня</p></div>
        <span class="progress-badge" id="progressText">0/0 (0%)</span>
      </div>
      <div class="progress-wrap"><div class="progress-fill" id="progressFill"></div></div>
      <div class="input-bar">
        <input type="text" id="taskInput" placeholder="Добавить задачу..." onkeydown="if(event.key==='Enter') addTask()">
        <select id="taskPrio"><option value="high">🔥 Высокий</option><option value="mid" selected>⚡ Обычный</option><option value="low">🌿 Низкий</option></select>
        <button class="btn-add" onclick="addTask()">+</button>
      </div>
      <div class="scroll-list" id="tasksList"></div>
    </section>
    <section class="panel-col view" id="view-habits">
      <div class="col-header"><div><h2>🔥 Трекер привычек</h2><p class="col-sub">Отмечай каждый день без пропусков</p></div></div>
      <div class="input-bar">
        <input type="text" id="habitInput" placeholder="Новая привычка..." onkeydown="if(event.key==='Enter') addHabit()">
        <button class="btn-add" onclick="addHabit()">+</button>
      </div>
      <div class="scroll-list" id="habitsList"></div>
    </section>
  </main>
  <nav class="mobile-nav">
    <button class="m-btn active" data-tab="tasks" onclick="switchTab('tasks')"><span>📋</span>Задачи</button>
    <button class="m-btn" data-tab="habits" onclick="switchTab('habits')"><span>🔥</span>Привычки</button>
  </nav>
  <script>if ('caches' in window) { caches.keys().then(n => n.forEach(k => caches.delete(k))); }</script>
  <script src="app.js?v=3"></script>
</body>
</html>
